name: Omnidex Bot

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Force jobs (space separated) or "all". Names: sync-chapters sync-news sync-popular repair-covers triage-reports maintenance. Leave empty to run only what is due.'
        required: false
        default: ''
      pages:
        description: 'sync-popular only: pages per type (50 series each). Use 40 for a big first fill.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: omnidex-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bot dependency
        run: npm install @supabase/supabase-js@2 --no-save --no-audit --no-fund

      - name: Run whatever is due
        id: bot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_NO_WARNINGS: 1
          FORCE_JOBS: ${{ github.event.inputs.jobs }}
          PAGES_PER_RUN: ${{ github.event.inputs.pages }}
        run: node scripts/tick.mjs

      - name: Open an issue if a job failed (one per job)
        if: steps.bot.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.bot.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for j in $FAILED; do
            title="Bot job failed: $j"
            if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
              gh issue create --title "$title" --body "The scheduled job \`$j\` failed. Logs: $RUN_URL"
            fi
          done
          exit 1
