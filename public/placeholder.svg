<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="omniPwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <radialGradient id="omniPwaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </radialGradient>
  </defs>

  <!-- PWA App Background Tile -->
  <rect width="192" height="192" rx="44" fill="#06080D" />
  <rect width="192" height="192" rx="44" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Guide Circle -->
  <circle cx="96" cy="96" r="62" stroke="#1E293B" stroke-width="4" stroke-opacity="0.8" />

  <!-- Iris Aperture Arc 1: Top Right -->
  <path d="M96 42A54 54 0 0 1 150 96" stroke="url(#omniPwaGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Iris Aperture Arc 2: Bottom Right -->
  <path d="M150 96A54 54 0 0 1 96 150" stroke="url(#omniPwaGrad)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Iris Aperture Arc 3: Bottom Left -->
  <path d="M96 150A54 54 0 0 1 42 96" stroke="url(#omniPwaGrad)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.55" />

  <!-- Iris Aperture Arc 4: Top Left -->
  <path d="M42 96A54 54 0 0 1 96 42" stroke="url(#omniPwaGrad)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.3" />

  <!-- Center Aperture Iris -->
  <circle cx="96" cy="96" r="20" fill="url(#omniPwaCore)" />
  <circle cx="96" cy="96" r="7" fill="#FFFFFF" />
